data:
  path: data/raw/creditcard.csv
  test_size: 0.2
  random_state: 42

preprocess:
  scale_columns:
    - Time
    - Amount

resample:
  strategy: smote
  smote_strategy: 0.1   # ratio after sampling, 0.1 = 10% minority
  random_state: 42

model:
  model_type: xgboost   # one of: logreg, randomforest, xgboost
  xgboost:
    n_estimators: 200
    max_depth: 5
    learning_rate: 0.1
    scale_pos_weight: 1
  logreg:
    C: 1.0
    max_iter: 200
  randomforest:
    n_estimators: 100
    max_depth: 10

eval:
  threshold: 0.5
